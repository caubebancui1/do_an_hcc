<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng nhập | UniTrack</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        *{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#edf2ef;font-family:'DM Sans',sans-serif}.login-box{background:#fff;padding:40px;border-radius:14px;box-shadow:0 4px 24px rgba(0,0,0,.06);width:100%;max-width:420px}.login-header{text-align:center;margin-bottom:28px}.login-header h1{font-family:'Space Grotesk',sans-serif;font-size:24px;color:#17232b;margin:0 0 4px}.login-header p{color:#75828a;font-size:13px;margin:0}.form-group{margin-bottom:16px}.form-group label{display:block;font-size:13px;font-weight:600;color:#17232b;margin-bottom:6px}.form-group input{width:100%;height:42px;padding:0 14px;border:1px solid #d5dbd8;border-radius:8px;font-size:14px;font-family:inherit;outline:none;transition:border .2s}.form-group input:focus{border-color:#5b87c8}.login-btn{width:100%;height:44px;background:#5b87c8;color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;transition:background .2s}.login-btn:hover{background:#4a75b5}.flash{margin-top:14px;padding:10px 14px;border-radius:8px;font-size:13px}.flash.error{background:#fdecea;color:#c0392b;border:1px solid #f5c6cb}.flash.success{background:#eafaf1;color:#2d6a4f;border:1px solid #b7e4c7}.footer-link{text-align:center;margin-top:18px;font-size:12px;color:#75828a}
    </style>
</head>
<body>
<div class="login-box">
    <div class="login-header">
        <h1>Đăng nhập</h1>
    </div>
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="flash {{ category }}">{{ message }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}
    <form method="post">
        <div class="form-group">
            <label>Tên đăng nhập</label>
            <input name="username" placeholder="tài khoản" required autofocus>
        </div>
        <div class="form-group">
            <label>Mật khẩu</label>
            <input type="password" name="password" placeholder="Mật khẩu" required>
        </div>
        <button type="submit" class="login-btn">Đăng nhập</button>
    </form>
</div>
<script>
    document.querySelectorAll('.flash').forEach((message) => {
        window.setTimeout(() => {
            message.style.transition = 'opacity 0.25s ease';
            message.style.opacity = '0';
            window.setTimeout(() => message.remove(), 250);
        }, 3000);
    });
</script>
</body>
</html>
